<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAXALUM · Lista Maestra + Calculadora</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #eef3f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .app {
      max-width: 1480px;
      width: 100%;
      background: white;
      border-radius: 40px;
      box-shadow: 0 30px 60px -20px rgba(0, 30, 60, 0.25);
      padding: 28px 32px 40px;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      gap: 18px 12px;
      border-bottom: 1px solid #e5ecf5;
      padding-bottom: 18px;
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #0b2b4a, #1d5a83);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .logo h1 i {
      -webkit-text-fill-color: #1d5a83;
      font-size: 1.7rem;
    }
    .logo small {
      font-weight: 400;
      font-size: 0.8rem;
      -webkit-text-fill-color: #5b7390;
      background: none;
      margin-left: 8px;
      letter-spacing: 0.2px;
    }

    .search-wrapper {
      display: flex;
      align-items: center;
      background: #f1f6fd;
      border-radius: 60px;
      padding: 4px 4px 4px 22px;
      border: 1px solid #dce5f0;
      transition: 0.2s;
      flex: 1 1 340px;
      min-width: 200px;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
    }
    .search-wrapper:focus-within {
      border-color: #1a6bb0;
      background: white;
      box-shadow: 0 0 0 4px rgba(26, 107, 176, 0.12);
    }
    .search-wrapper i {
      color: #6a82a0;
      font-size: 1rem;
    }
    .search-wrapper input {
      border: none;
      background: transparent;
      padding: 14px 14px 14px 10px;
      font-size: 1rem;
      width: 100%;
      outline: none;
      font-weight: 450;
      color: #142b44;
    }
    .search-wrapper input::placeholder {
      color: #95acc9;
      font-weight: 400;
    }
    .search-wrapper button {
      background: #1a4b75;
      border: none;
      color: white;
      padding: 10px 26px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
    .search-wrapper button:hover {
      background: #0f3a5c;
      transform: scale(0.96);
    }

    .calc-panel {
      background: linear-gradient(135deg, #e7f0fa 0%, #dce8f5 100%);
      border-radius: 28px;
      padding: 24px 32px;
      margin-bottom: 32px;
      border: 1px solid #c8d8ec;
      box-shadow: 0 6px 16px rgba(0, 30, 60, 0.06);
    }

    .calc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .calc-title {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .calc-title i {
      font-size: 2rem;
      color: #1a5a8a;
      background: white;
      padding: 10px;
      border-radius: 16px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.04);
    }
    .calc-title h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #0b2b4a;
    }
    .calc-title .badge {
      background: #1a4b75;
      color: white;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .calc-body {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 20px 30px;
    }

    .calc-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1 1 140px;
      min-width: 120px;
    }
    .calc-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #1a3b5c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .calc-group label i {
      color: #3b6a94;
      font-size: 0.85rem;
    }
    .calc-group input {
      padding: 12px 16px;
      border: 1px solid #c6d7eb;
      border-radius: 14px;
      font-size: 1rem;
      background: white;
      outline: none;
      transition: 0.15s;
      font-weight: 500;
      color: #0a223a;
      width: 100%;
    }
    .calc-group input:focus {
      border-color: #1a5a8a;
      box-shadow: 0 0 0 3px rgba(26, 90, 138, 0.12);
    }
    .calc-group input[type="number"] {
      -moz-appearance: textfield;
    }
    .calc-group input[type="number"]::-webkit-inner-spin-button,
    .calc-group input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .calc-result-box {
      background: #103c60;
      padding: 12px 28px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1 1 200px;
      min-width: 180px;
      box-shadow: 0 4px 12px rgba(0,30,60,0.2);
    }
    .calc-result-box .result-label {
      color: #aac6e8;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .calc-result-box .result-value {
      color: white;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .calc-result-box i {
      color: #7aa9d9;
      font-size: 1.4rem;
    }

    .calc-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .calc-actions button {
      background: white;
      border: 1px solid #c6d7eb;
      padding: 10px 18px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #1a3b5c;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .calc-actions button:hover {
      background: #f0f6fe;
      border-color: #1a5a8a;
    }
    .calc-actions button.clear-btn {
      color: #b13e3e;
      border-color: #f0d0d0;
    }
    .calc-actions button.clear-btn:hover {
      background: #fff0f0;
      border-color: #b13e3e;
    }

    .table-container {
      border-radius: 24px;
      border: 1px solid #e3ebf6;
      overflow: auto;
      background: white;
      box-shadow: 0 8px 24px rgba(0, 20, 40, 0.04);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      min-width: 720px;
    }

    th {
      background: #f2f8ff;
      color: #1a3f62;
      font-weight: 600;
      padding: 16px 16px;
      text-align: left;
      border-bottom: 2px solid #d6e2f2;
      letter-spacing: 0.2px;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    th:last-child, td:last-child {
      text-align: right;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #eef3fa;
      color: #1a314b;
      vertical-align: middle;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background: #f7fcff;
    }

    .code-cell {
      font-weight: 600;
      color: #0a2944;
      font-size: 0.85rem;
      letter-spacing: 0.1px;
    }
    .desc-cell {
      font-weight: 450;
      color: #1a314b;
      max-width: 320px;
      word-break: break-word;
    }
    .price-cell {
      font-weight: 600;
      color: #0c3f64;
      white-space: nowrap;
    }
    .discount-cell {
      color: #6a7f99;
      font-weight: 450;
      white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      padding: 56px 20px;
      color: #5b7190;
    }
    .empty-state i {
      font-size: 2.8rem;
      opacity: 0.4;
      margin-bottom: 14px;
      display: block;
    }

    .footer-stats {
      margin-top: 22px;
      display: flex;
      justify-content: flex-end;
      font-size: 0.8rem;
      color: #7a93b2;
      gap: 20px;
      flex-wrap: wrap;
    }
    .footer-stats i {
      margin-right: 4px;
    }

    @media (max-width: 850px) {
      .app { padding: 18px; }
      .header { flex-direction: column; align-items: stretch; }
      .search-wrapper { flex: 1; }
      .calc-body { flex-direction: column; align-items: stretch; }
      .calc-group { flex: 1; }
      .calc-result-box { justify-content: center; }
      .calc-actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
<div class="app" id="app">

  <div class="header">
    <div class="logo">
      <h1><i class="fas fa-cubes"></i> MAXALUM <small>· lista completa</small></h1>
    </div>
    <div class="search-wrapper">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Buscar por código o descripción...">
      <button id="searchBtn"><i class="fas fa-arrow-right"></i> Buscar</button>
    </div>
  </div>

  <div class="calc-panel">
    <div class="calc-header">
      <div class="calc-title">
        <i class="fas fa-calculator"></i>
        <div>
          <h2>Calculadora de láminas</h2>
          <span style="font-size:0.8rem; color:#3b6a94;">Precio × Largo × Cantidad</span>
        </div>
        <span class="badge"><i class="fas fa-arrow-right"></i> total</span>
      </div>
      <div class="calc-actions">
        <button id="clearCalcBtn" class="clear-btn"><i class="fas fa-undo-alt"></i> Limpiar</button>
        <button id="exampleBtn"><i class="fas fa-lightbulb"></i> Ejemplo</button>
      </div>
    </div>

    <div class="calc-body">
      <div class="calc-group">
        <label><i class="fas fa-tag"></i> Precio lista (₡)</label>
        <input type="number" id="precioInput" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="calc-group">
        <label><i class="fas fa-arrows-alt-h"></i> Largo (m)</label>
        <input type="number" id="largoInput" placeholder="2.44" step="0.01" min="0" value="2.44">
      </div>
      <div class="calc-group">
        <label><i class="fas fa-cubes"></i> Cantidad</label>
        <input type="number" id="cantidadInput" placeholder="1" step="1" min="1" value="1">
      </div>
      <div class="calc-result-box">
        <i class="fas fa-coin"></i>
        <div>
          <div class="result-label">Total</div>
          <div class="result-value" id="priceTotalDisplay">₡0.00</div>
        </div>
      </div>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Descripción</th>
          <th style="text-align:right">Descuento</th>
          <th style="text-align:right">Precio lista</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="footer-stats">
    <span><i class="fas fa-database"></i> <span id="countDisplay">0</span> artículos</span>
    <span><i class="fas fa-sync-alt"></i> actualizado 2026</span>
  </div>
</div>

    // DOM refs
    const tbody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const countDisplay = document.getElementById('countDisplay');

    const precioInput = document.getElementById('precioInput');
    const largoInput = document.getElementById('largoInput');
    const cantidadInput = document.getElementById('cantidadInput');
    const priceTotalDisplay = document.getElementById('priceTotalDisplay');
    const clearCalcBtn = document.getElementById('clearCalcBtn');
    const exampleBtn = document.getElementById('exampleBtn');

    // Render
    function renderItems(list) {
      if (!list || list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-state"><i class="fas fa-box-open"></i>No hay artículos que coincidan</td></tr>`;
        countDisplay.textContent = '0';
        return;
      }
      let html = '';
      list.forEach(item => {
        html += `<tr>
          <td class="code-cell">${item.sap}</td>
          <td class="desc-cell">${item.desc}</td>
          <td class="discount-cell">${item.descuento}</td>
          <td class="price-cell">${item.precio}</td>
        </tr>`;
      });
      tbody.innerHTML = html;
      countDisplay.textContent = list.length;
    }

    // Filtro
    function filterItems() {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) {
        renderItems(items);
        return;
      }
      const filtered = items.filter(item => 
        item.sap.toLowerCase().includes(q) || 
        item.desc.toLowerCase().includes(q)
      );
      renderItems(filtered);
    }

    searchBtn.addEventListener('click', filterItems);
    searchInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') filterItems();
    });

    // Calculadora
    function updateTotal() {
      let precio = parseFloat(precioInput.value.replace(',', '.')) || 0;
      let largo = parseFloat(largoInput.value.replace(',', '.')) || 0;
      let cantidad = parseFloat(cantidadInput.value.replace(',', '.')) || 0;
      if (largo < 0) largo = 0;
      if (cantidad < 0) cantidad = 0;
      const total = precio * largo * cantidad;
      priceTotalDisplay.textContent = `₡${total.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",")}`;
    }

    precioInput.addEventListener('input', updateTotal);
    largoInput.addEventListener('input', updateTotal);
    cantidadInput.addEventListener('input', updateTotal);

    clearCalcBtn.addEventListener('click', () => {
      precioInput.value = '';
      largoInput.value = '2.44';
      cantidadInput.value = '1';
      updateTotal();
    });

    exampleBtn.addEventListener('click', () => {
      precioInput.value = '3244.46';
      largoInput.value = '2.44';
      cantidadInput.value = '5';
      updateTotal();
    });

    // Inicializar
    renderItems(items);
    updateTotal();

    // Escape para limpiar búsqueda
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        searchInput.value = '';
        renderItems(items);
        searchInput.focus();
      }
    });
